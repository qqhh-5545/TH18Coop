[Graphics]
; Existing game-directory graphics fix is authoritative. Leave the old candidate off.
StampCacheGuard=0
; 0 = invisible, 255 = opaque. Default ghost base is 80; rescue fades toward 254.
GhostAlpha=80

[Diagnostics]
; Bounded raw input trace (up to three seats), not a playable multiplayer replay.
InputTrace=1

[Selection]
; P1 then P2 (then P3 in three-seat online games), using the native menu.
NativeSequential=1

[Player2]
; Fallback only for late F7 joins or NativeSequential=0. Never overrides in-game choices.
; 0 Reimu, 1 Marisa, 2 Sakuya, 3 Sanae. Maximum two initial cards.
Character=1
CustomCards=1
Card1=-1
Card2=-1
